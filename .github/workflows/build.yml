name: Build
on: push
permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install zip
        run: sudo apt-get install -y jq
      - id: getname
        run: |
          echo "NAME=$(cat info.json | jq '.id' | tr -d '"')" >> "$GITHUB_ENV"
          echo "ICON=$(cat info.json | jq '.icon' | tr -d '"')" >> "$GITHUB_ENV"
      - uses: vimtor/action-zip@v1
        with:
          files: info.json ${{ env.ICON }} main.js
          dest: ${{ env.NAME }}.potext
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}.potext
          path: "*.potext"
          if-no-files-found: error
      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }} 通用 OpenAI 兼容翻译插件
          body: |
            pot-desktop 通用 OpenAI 兼容 AI 翻译插件:自定义服务地址 + API 密钥,支持 DeepSeek / OpenAI / Kimi / 智谱 / Ollama / one-api 等任何 OpenAI 兼容接口。

            **安装**:下载下方 `plugin.com.generic.openai_compatible.potext`,在 pot 的 设置 → 服务设置 → 翻译服务 → 添加插件 中本地安装。

            **配置**:填「服务地址」和「API 密钥」;「模型」留空或填 `?` 后随便翻译一句,可用模型列表会显示在结果框,复制一个填回配置即可。
          files: "*.potext"
